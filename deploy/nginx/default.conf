# HTTP only until a domain points at the VM; then add the 443 server (see deploy/README.md).
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 8m;   # documents up to 5 MB (multipart limit 6 MB)

    # Let's Encrypt HTTP challenge (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /v1/ {
        proxy_pass http://api:8080;   # no URI part: /v1/... passes through as is (context path /v1)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    root /usr/share/nginx/html;

    # Hashed build files never change.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, which must not be cached (it names the current bundles).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
